<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="metalDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="38%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="92%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <linearGradient id="hubPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="slotGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="partShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f1f5f9"/>

  <!-- Shadow below part -->
  <ellipse cx="600" cy="740" rx="420" ry="40" fill="#000" opacity="0.22" filter="blur(16px)"/>

  <g filter="url(#partShadow)">
    <!-- Outer Rotor Outer Edge -->
    <circle cx="600" cy="450" r="340" fill="#475569" stroke="#334155" stroke-width="4"/>

    <!-- Friction Surface (Braking Band) -->
    <circle cx="600" cy="450" r="334" fill="url(#metalDisc)"/>

    <!-- Concentric Machining Grooves (Texture disc de frână nou) -->
    <circle cx="600" cy="450" r="320" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
    <circle cx="600" cy="450" r="300" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.5"/>
    <circle cx="600" cy="450" r="280" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
    <circle cx="600" cy="450" r="260" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>
    <circle cx="600" cy="450" r="240" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
    <circle cx="600" cy="450" r="220" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.5"/>

    <!-- Perforated Cooling Holes (Găuri ventilație sport) -->
    <!-- Inel exterior găuri -->
    <g fill="#0f172a" stroke="#cbd5e1" stroke-width="1">
      <circle cx="600" cy="180" r="8"/><circle cx="600" cy="720" r="8"/>
      <circle cx="330" cy="450" r="8"/><circle cx="870" cy="450" r="8"/>
      <circle cx="410" cy="260" r="8"/><circle cx="790" cy="640" r="8"/>
      <circle cx="790" cy="260" r="8"/><circle cx="410" cy="640" r="8"/>
      <circle cx="470" cy="200" r="8"/><circle cx="730" cy="700" r="8"/>
      <circle cx="730" cy="200" r="8"/><circle cx="470" cy="700" r="8"/>
      <circle cx="350" cy="350" r="8"/><circle cx="850" cy="550" r="8"/>
      <circle cx="850" cy="350" r="8"/><circle cx="350" cy="550" r="8"/>
    </g>

    <!-- Inel median găuri -->
    <g fill="#0f172a" stroke="#cbd5e1" stroke-width="0.8">
      <circle cx="600" cy="215" r="6"/><circle cx="600" cy="685" r="6"/>
      <circle cx="365" cy="450" r="6"/><circle cx="835" cy="450" r="6"/>
      <circle cx="435" cy="285" r="6"/><circle cx="765" cy="615" r="6"/>
      <circle cx="765" cy="285" r="6"/><circle cx="435" cy="615" r="6"/>
    </g>

    <!-- Brembo Sport Curved Grooves (Caneluri de curățare plăcuțe) -->
    <g stroke="url(#slotGlow)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M 600 170 Q 560 210 520 230"/>
      <path d="M 730 200 Q 710 250 670 280"/>
      <path d="M 830 320 Q 790 350 740 370"/>
      <path d="M 870 450 Q 820 470 780 470"/>
      <path d="M 800 580 Q 750 580 710 550"/>
      <path d="M 690 680 Q 640 660 620 610"/>
      <path d="M 520 680 Q 510 630 530 580"/>
      <path d="M 370 580 Q 400 540 450 520"/>
      <path d="M 330 450 Q 370 420 420 420"/>
      <path d="M 370 320 Q 420 320 460 350"/>
      <path d="M 470 220 Q 520 240 540 290"/>
      <path d="M 600 730 Q 600 680 580 630"/>
    </g>

    <!-- Central Hat / Hub Drum (Miezul central) -->
    <circle cx="600" cy="450" r="180" fill="url(#hubPaint)" stroke="#475569" stroke-width="3"/>
    <circle cx="600" cy="450" r="172" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Central Hub Mounting Face -->
    <circle cx="600" cy="450" r="130" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Center Bore (Gaura de centrare pe butuc 65mm) -->
    <circle cx="600" cy="450" r="50" fill="#020617" stroke="#475569" stroke-width="3"/>
    <circle cx="600" cy="450" r="46" fill="#000000"/>

    <!-- 5 Wheel Bolt Holes (5x112 PCD) -->
    <!-- Gaura 1 -->
    <circle cx="600" cy="360" r="14" fill="#020617" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Gaura 2 -->
    <circle cx="685" cy="422" r="14" fill="#020617" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Gaura 3 -->
    <circle cx="653" cy="522" r="14" fill="#020617" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Gaura 4 -->
    <circle cx="547" cy="522" r="14" fill="#020617" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Gaura 5 -->
    <circle cx="515" cy="422" r="14" fill="#020617" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Disc Retaining Screw Hole (Șurub fixare disc) -->
    <circle cx="560" cy="385" r="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Brembo Logo Gravat pe Pălărie -->
    <text x="600" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="3">brembo</text>
    <text x="600" y="492" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">MAX 09.9772.11</text>
  </g>

  <!-- Tag / Badge Identificare Produs -->
  <g transform="translate(60, 60)">
    <rect width="280" height="42" rx="8" fill="#0f172a" opacity="0.92"/>
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ef4444">Vedere Frontală (Disc Perforat)</text>
  </g>
</svg>

