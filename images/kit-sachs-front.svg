<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="clutchFriction" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </radialGradient>
    <filter id="clutchShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#f1f5f9"/>
  <ellipse cx="600" cy="740" rx="420" ry="40" fill="#000" opacity="0.22" filter="blur(16px)"/>

  <g filter="url(#clutchShadow)">
    <!-- Pressure Plate / Placă Presiune (Outer Cast Iron Ring) -->
    <circle cx="600" cy="450" r="330" fill="#3b82f6" stroke="#1d4ed8" stroke-width="4"/>
    <circle cx="600" cy="450" r="322" fill="#1e293b"/>

    <!-- Diaphragm Spring Fingers (Soarele plăcii de ambreiaj) -->
    <g fill="#94a3b8" stroke="#0f172a" stroke-width="2.5">
      <!-- 18 Diaphragm Spring Fingers radiating outward -->
      <polygon points="590,260 610,260 605,370 595,370"/>
      <polygon points="650,270 668,280 645,380 635,375"/>
      <polygon points="705,300 720,315 675,400 665,390"/>
      <polygon points="745,345 755,365 695,430 685,418"/>
      <polygon points="765,400 765,420 698,460 692,448"/>
      <polygon points="765,480 755,500 685,482 695,470"/>
      <polygon points="720,585 705,600 665,510 675,500"/>
      <polygon points="668,620 650,630 635,525 645,520"/>
      <polygon points="610,640 590,640 595,530 605,530"/>
      <polygon points="550,630 532,620 555,520 565,525"/>
      <polygon points="495,600 480,585 525,500 535,510"/>
      <polygon points="455,555 445,535 505,470 515,482"/>
      <polygon points="435,500 435,480 502,440 508,452"/>
      <polygon points="445,365 455,345 515,418 505,430"/>
      <polygon points="480,315 495,300 535,390 525,400"/>
      <polygon points="532,280 550,270 565,375 555,380"/>
    </g>

    <!-- Clutch Disc Inner Hub with Torsion Springs (Discul de ambreiaj cu arcuri torsiune) -->
    <circle cx="600" cy="450" r="160" fill="url(#clutchFriction)" stroke="#3b82f6" stroke-width="3"/>

    <!-- 4 Heavy-Duty Torsion Coil Springs (Arcuri elicoidale) -->
    <!-- Arc Sus -->
    <rect x="575" y="330" width="50" height="25" rx="6" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <!-- Arc Dreapta -->
    <rect x="695" y="425" width="25" height="50" rx="6" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <!-- Arc Jos -->
    <rect x="575" y="545" width="50" height="25" rx="6" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <!-- Arc Stânga -->
    <rect x="480" y="425" width="25" height="50" rx="6" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>

    <!-- Center Spline Hub (Caneluri priză cutie de viteze) -->
    <circle cx="600" cy="450" r="65" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="600" cy="450" r="45" fill="#020617"/>
    <!-- Spline teeth -->
    <circle cx="600" cy="450" r="42" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6,4"/>

    <!-- Sachs Branding -->
    <text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#3b82f6" text-anchor="middle" letter-spacing="3">SACHS</text>
    <text x="600" y="512" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">3000 951 043</text>
  </g>

  <g transform="translate(60, 60)">
    <rect width="280" height="42" rx="8" fill="#0f172a" opacity="0.92"/>
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#3b82f6">Kit Ambreiaj Sachs (Complet)</text>
  </g>
</svg>

